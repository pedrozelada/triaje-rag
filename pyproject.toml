[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triaje-rag"
version = "1.0.0"
description = "Sistema de Triaje Médico con RAG basado en las NNAC de Bolivia"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # IA / RAG
    "llama-index==0.14.16",
    "llama-index-embeddings-huggingface==0.7.0",
    "llama-index-llms-groq==0.5.0",
    "llama-index-vector-stores-chroma==0.5.5",
    "chromadb==1.5.9",
    "sentence-transformers==5.5.1",

    # Interfaces
    "gradio==6.17.3",
    "streamlit==1.58.0",

    # Backend
    "fastapi==0.136.3",
    "uvicorn==0.49.0",

    # Base de datos
    "sqlalchemy==2.0.50",

    # Configuración
    "python-dotenv==1.2.2",

    # Validación
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",

    # Autenticación
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.5.0",

    # HTTP
    "httpx==0.28.1",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["ai_service", "ai_service.providers", "ui", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]