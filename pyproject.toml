[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triaje-rag"
version = "1.0.0"
description = "Sistema de Triaje Médico con RAG basado en las NNAC de Bolivia"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # IA / RAG
    "llama-index==0.14.16",
    "llama-index-embeddings-huggingface==0.7.0",
    "llama-index-llms-groq==0.5.0",
    "llama-index-llms-google-genai==0.11.2",
    "llama-index-vector-stores-chroma==0.5.5",
    "chromadb==1.5.9",
    "sentence-transformers==5.5.1",

    # PDF (informes)
    "reportlab==5.0.1",

    # Backend
    "fastapi==0.136.3",
    "uvicorn==0.49.0",

    # Base de datos
    "sqlalchemy==2.0.50",

    # Configuración
    "python-dotenv==1.2.2",

    # Validación
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",

    # Autenticación
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.5.0",

    # HTTP
    "httpx==0.28.1",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# Los subpaquetes (backend.api.admin, backend.services, backend.reports...) se
# descubren solos: una lista explícita se olvida de los nuevos y deja una
# instalación incompleta.
[tool.setuptools.packages.find]
include = ["ai_service*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# 100 y no 88: el proyecto ya venía con ese ancho de línea en mente.
line-length = 100
target-version = "py314"
extend-exclude = ["venv", "chroma_db", "data", "docs", "logs", ".kilo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declara las dependencias como valor por defecto (`Depends(get_db)`),
# que B008 marca como llamada en argumento por defecto.
"backend/api/**" = ["B008"]

[tool.coverage.run]
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true